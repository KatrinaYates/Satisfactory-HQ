<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9f7ff"><meta name="description" content="Satisfactory HQ: a pastel industrial campus planning hub.">
<title>Satisfactory HQ | Factory Campus</title>
<style>
:root{--bg:#f8f8fc;--card:#fff;--ink:#2c3045;--muted:#737b91;--line:#e8e9f2;--pink:#edadd4;--blue:#a9d9f3;--green:#a8dfc6;--purple:#c5b3f5;--accent:#7762bb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #8d75d6;outline-offset:3px}aside{position:fixed;inset:0 auto 0 0;width:245px;padding:28px 17px;background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:850;letter-spacing:-.7px;padding:4px 9px 33px}.logo small{display:block;font-size:10px;font-weight:750;color:#9991b2;letter-spacing:1.7px}.mark{width:38px;height:38px;flex:none;border-radius:12px;background:conic-gradient(var(--pink),var(--purple),var(--blue),var(--green),var(--pink))}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;background:transparent;border-radius:11px;padding:12px 13px;color:#72788c;font-weight:650}.nav button:hover,.nav button.active{background:#f1edff;color:#6855ad}.footer{margin-top:auto;background:#faf8ff;border-radius:13px;padding:13px;font-size:12px;color:#8e89a2}main{margin-left:245px;max-width:1450px;padding:40px clamp(20px,4vw,70px) 90px}.eyebrow{font-size:11px;letter-spacing:1.9px;text-transform:uppercase;color:#9484ba;font-weight:800}.headline{font-size:clamp(30px,4vw,46px);line-height:1.14;letter-spacing:-1.6px;margin:12px 0}.lead{color:var(--muted);max-width:760px;margin:0 0 27px}.hero{background:linear-gradient(115deg,#fae6f4,#eceeff 52%,#e8faf2);border:1px solid #fff;border-radius:24px;padding:32px;margin:18px 0 24px;box-shadow:0 10px 35px #39385209}.hero h2{font-size:28px;margin:0}.hero p{color:#626984;max-width:770px}.tag{background:#f0ecff;color:#6d5bac;padding:6px 11px;border-radius:50px;font-size:11px;font-weight:750;display:inline-block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:22px;box-shadow:0 5px 22px #29294a06;min-width:0}.card h3{margin:0 0 8px;font-size:17px}.card p,.small{color:var(--muted);font-size:13px}.card p{margin:8px 0}.wide{grid-column:span 2}.section{margin:34px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.section h2{font-size:22px;letter-spacing:-.7px;margin:0}.metric{font-size:32px;font-weight:850;letter-spacing:-1px}.bar{height:9px;background:#f1eef7;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue))}.btn{background:var(--accent);color:white;padding:10px 15px;border:0;border-radius:10px;font-size:13px;font-weight:800}.btn:hover{background:#6251a4}.btn.alt{background:#f1ecff;color:#6b59ad}.swatches{display:flex;gap:10px;margin:12px 0}.swatch{height:36px;width:36px;border-radius:11px;border:1px solid #0000000b}.phase{background:white;border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}.phase>button{background:transparent;border:0;text-align:left;padding:17px;display:flex;gap:14px;align-items:center;width:100%;color:var(--ink)}.phase>button:hover{background:#faf9ff}.num{display:grid;place-items:center;background:#f0ebfc;width:40px;height:40px;border-radius:11px;color:#7963b4;font-weight:850;flex:none}.phase-body{padding:0 20px 20px 72px}.phase-body li{padding:5px 0}.phase-body li::marker{color:#ad9acb}.status{font-size:11px;font-weight:800;color:#8a80a3;letter-spacing:.3px}.colored{height:8px;border-radius:20px;margin:-22px -22px 18px}.campus{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:20px 0}.campus div{text-align:center;padding:21px 5px;border-radius:13px;font-size:12px;font-weight:850}.campus .path{background:#fafaff;border:1px dashed #d1cce5;color:#a19bb4}.campus .hq{background:#f8ddec}.campus .iron{background:#dcedfc}.campus .assembly{background:#dff5e9}.campus .steel{background:#e9e0fc}.campus .future{background:#f2f0f7}.listline{padding:15px 0;border-bottom:1px solid var(--line)}.listline:last-child{border:0}.listline h3{font-size:15px;margin:2px 0}.muted{color:var(--muted)}.note{border-left:4px solid var(--purple);padding-left:16px;margin:15px 0}.note strong{font-size:14px}.note p{margin:5px 0;white-space:pre-wrap}.date{font-size:11px;color:#a3a0b0}.detail{margin-top:22px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px}.detail li{margin:8px 0}.hide{display:none}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chip{display:inline-block;padding:5px 9px;border-radius:100px;font-size:11px;font-weight:700;background:#f5f2fa;color:#78669e;margin:0 5px 10px 0}.steps{padding-left:21px}.steps li{padding:6px 0}.toplink{color:#7964b5;font-size:13px;text-decoration:none;font-weight:700}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){aside{position:fixed;inset:auto 0 0 0;width:auto;padding:6px;background:#ffffffef;backdrop-filter:blur(10px);border-right:0;border-top:1px solid var(--line)}.logo,.footer{display:none}.nav{display:flex;gap:1px;justify-content:space-around}.nav button{font-size:11px;white-space:nowrap;padding:11px 6px}main{margin:0;padding:25px 15px 110px}.grid,.cols2{grid-template-columns:1fr}.wide{grid-column:span 1}.hero{padding:24px}.phase-body{padding-left:25px}.campus{gap:5px}.campus div{padding:15px 2px;font-size:10px}}

/* Mobile-first usability enhancements */
.more-toggle,.mobile-more{display:none}
@media(max-width:720px){
 body{font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
 aside{padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 25px #302e5810}
 .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;gap:4px}
 .nav button{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;font-size:12px;line-height:1.2;padding:9px 3px;white-space:normal}
 .nav button[data-page="blueprints"],.nav button[data-page="journal"],.nav button[data-page="standards"]{display:none}
 .nav .more-toggle{display:flex}
 .nav .more-toggle.active{background:#f1edff;color:#6855ad}
 .mobile-more:not([hidden]){display:grid;position:absolute;bottom:calc(68px + env(safe-area-inset-bottom,0px));right:10px;width:min(240px,calc(100vw - 20px));background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 36px #26243f27;padding:8px;z-index:10}
 .mobile-more button{border:0;background:white;color:var(--ink);text-align:left;min-height:48px;padding:12px 14px;border-radius:9px;font-weight:650}
 .mobile-more button:hover,.mobile-more button:focus-visible{background:#f4f0ff}
 main{padding:23px 16px calc(120px + env(safe-area-inset-bottom,0px))}
 .headline{font-size:clamp(29px,8vw,38px);letter-spacing:-1.1px;overflow-wrap:anywhere}
 .hero{padding:22px 19px;border-radius:18px}
 .hero h2{font-size:24px;line-height:1.23}
 .card{padding:19px;border-radius:16px}
 .colored{margin:-19px -19px 16px}
 .grid,.cols2{gap:12px}
 .lead{line-height:1.55}
 .phase>button{min-height:69px;padding:14px 12px;gap:10px}
 .phase-body{padding:0 14px 18px 22px}
 .section{margin-top:27px}
 .section h2{font-size:21px}
 .btn{min-height:44px}
 .chip{line-height:1.4}
 .campus div{overflow-wrap:anywhere}
}
@media(max-width:375px){
 main{padding-left:12px;padding-right:12px}
 .nav button{font-size:11px}
 .card{padding:16px}
 .colored{margin:-16px -16px 16px}
 .campus{gap:4px}
 .campus div{font-size:9px;padding:13px 2px}
 .phase>button{gap:8px}
 .status{font-size:10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<aside><div class="logo"><div class="mark"></div><div>Satisfactory HQ<small>FACTORY CAMPUS</small></div></div><nav class="nav" id="nav"><button data-page="overview">⌂ Overview</button><button data-page="roadmap">◫ Roadmap</button><button data-page="buildings">▦ Buildings</button><button data-page="blueprints">◇ Blueprints</button><button data-page="journal">✎ Journal</button><button data-page="standards">✧ Design</button><button class="more-toggle" data-more="true" aria-expanded="false" aria-controls="mobile-more">⋯ More</button></nav><div class="mobile-more" id="mobile-more" hidden><button data-page="blueprints">◇ Blueprints</button><button data-page="journal">✎ Journal</button><button data-page="standards">✧ Design</button></div><div class="footer">A living Satisfactory project.<br>Updated through ChatGPT, stored in GitHub.<br><strong>Tier 4 · Planning</strong></div></aside>
<main id="app"></main>
<script>
const project={
updated:"2026-11-16",tier:"Tier 4",phase:1,completed:{},
phases:[
["Master planning","Choose a site, overall layout and standards.",["Choose HQ location and campus boundaries","Plan building districts and expansion plots","Establish common foundation grid and pedestrian routes","Finalize architecture and color standards"]],
["Headquarters","Build our comfortable home base.",["Build glass HQ shell with Craft Bench, Equipment Workshop, MAM and HUB access","Create labeled personal supply storage","Build an observation mezzanine","Reserve a transportation lobby for future hypertubes"]],
["Blueprint library","Create reusable, maintainable modules.",["Design smelter and constructor modules","Design assembler and logistics modules","Design matching glass facade and walkway modules","Test footprints, belt capacity and future expansion"]],
["Iron Works","Build the first production hall.",["Build blue iron hall and logistics floor","Move smelting, plate and rod production into modules","Send output to assembly, with a branch to HQ supply","Add catwalks and glass observation windows"]],
["Assembly Hall","Manufacture higher-level iron components.",["Build mint-green hall","Make reinforced plates, rotors and modular frames","Feed component lines directly rather than through personal storage","Add overhead viewing loop"]],
["Steel Works","Bring steel production into the campus plan.",["Choose coal/iron transport approach","Build purple hall or satellite production area","Organize foundries, beams, pipes and downstream parts","Connect steel delivery and pedestrian route"]],
["Connected campus","Make it delightful to move around.",["Finish elevated pedestrian avenue and skybridges","Add signage, access, lighting and scenic viewing spots","Add hypertubes once unlocked","Keep visible belts intentional and tidy"]],
["Expansion & polish","Grow without sacrificing looks.",["Identify bottlenecks and duplicate production modules","Expand with later production families","Upgrade mining and transportation","Finish exterior landscaping, interiors and architecture"]]
],
buildings:[
{name:"Headquarters",color:"#edadd4",role:"Your main place to work",desc:"Pink, bright glass HQ. Workshop, easy-to-reach labeled supplies, spacious storage atrium, mezzanine observation deck, and future transit lobby.",steps:["Workshop near HUB, Craft Bench, Equipment Workshop and MAM","Personal supply containers with clear labels","Storage gets a branch of production, not all production routed through it","Glass lookout with sightlines to working machinery","Central walkway connections to all major buildings"]},
{name:"Iron Works",color:"#a9d9f3",role:"Basic iron production",desc:"Blue-glass factory hall for smelting, plates and rods. Modular machine pods, orderly manifolds, visible process belts and a hidden maintenance floor.",steps:["Smelters and constructors grouped in replaceable pods","Leave clearance for more miner output later","Production priority before personal storage","Separate sightseeing walkways from logistics"]},
{name:"Assembly Hall",color:"#a8dfc6",role:"Advanced iron components",desc:"Mint-green assembly bays for reinforced plates, rotors, and modular frames, with short ingredient routes and local screws where helpful.",steps:["Reusable two-input assembler bays","Keep screw production close to its consumers","Expandable upstream supply","Viewing mezzanine around assembly floor"]},
{name:"Steel Works",color:"#c5b3f5",role:"Steel production",desc:"Purple-accented foundries and beam/pipe production. Can be a satellite factory if coal is far away; transport useful steel products back to HQ.",steps:["Determine best coal and iron source","Keep coal logistics off pedestrian routes","Produce beams and pipes near foundries","Supply steel to campus and personal warehouse"]},
{name:"Manufacturing Avenue",color:"#b5d6e4",role:"Walkways and skybridges",desc:"The main campus experience: a two-foundation-wide central concourse where practical, glass skybridges, railings, signs, and great views.",steps:["Easy path from HQ to every building","Glass fronts showcase working machines","Skybridges connect mezzanines","Reserve room for future hypertubes"]},
{name:"Future Districts",color:"#dad5ea",role:"Room to grow",desc:"Reserved land for the new production chains and power upgrades you'll unlock after Tier 4.",steps:["Reserve expansion plots","Extend foundation grid consistently","Keep next-phase decisions flexible"]}
],
blueprints:[
["Smelter Pod","Production","Planned","Four smelters with connected power and a clean manifold. At 100%: 120 ore/min into 120 iron ingots/min."],
["Constructor Pod","Production","Planned","Four constructors; configure variants for plates or rods. Keep identical belt direction and access."],
["Assembler Pod","Production","Planned","Two assemblers with two input lanes and one output, plus service access."],
["Glass Facade","Architecture","Planned","Repeatable glass wall segment, pillars and matching roof line."],
["Skybridge Segment","Architecture","Planned","Elevated walkway with rails and matching supports."],
["Storage Bay","Architecture","Idea","A labeled, accessible personal supply wall with clean rear belt feeds."]
],
journal:[
["Decision","Campus strategy","Hybrid industrial campus, centered on a glass HQ and specialized, expandable production buildings grouped by product family.","2026-11-16"],
["Decision","Color scheme","Pink HQ, blue Iron Works, mint Assembly Hall, purple Steel Works. White and charcoal framing with large glass sections.","2026-11-16"],
["Decision","Personal storage","One nearby supply warehouse for building materials; manufacturing feeds other manufacturing before storage branches.","2026-11-16"],
["Idea","Manufacturing avenue","A central walkable corridor with glass-fronted factories, aerial skybridges and overlooks into running machine lines.","2026-11-16"],
["Decision","Site name","Satisfactory HQ. Keep the website simple, static and maintained by ChatGPT through GitHub, no database.","2026-11-16"]
],
questions:["Where is the best site for the HQ and connected districts?","How much flat land and expansion space are available?","Which iron, copper and coal sources should feed the campus?","Which AWESOME Shop architectural pieces are unlocked?"]
};
const app=document.getElementById("app");let page=(location.hash.slice(1)||"overview"),activeBuilding=-1,expanded=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function header(title,lead){return '<div class="eyebrow">SATISFACTORY HQ / FACTORY CAMPUS</div><h1 class="headline">'+esc(title)+'</h1><p class="lead">'+esc(lead)+'</p><span class="tag">'+esc(project.tier)+' · Phase '+project.phase+' · Planning</span>'}
function progress(){let all=project.phases.reduce((n,p)=>n+p[2].length,0),done=Object.values(project.completed).filter(Boolean).length;return {all,done,pct:Math.round(done/all*100)}}
function overview(){let p=progress();return header("Your factory, beautifully organized.","One calm place for the big plan, the next build, and everything we've decided.")+'<section class="hero"><div class="eyebrow">THE VISION</div><h2>A pastel glass industrial city.</h2><p>A central workshop-and-storage HQ with observation decks, connected factory districts, scenic skybridges, and modular production. You play the game. ChatGPT maintains the plan.</p><button class="btn" data-page="roadmap">View master roadmap →</button></section><div class="grid"><div class="card"><div class="small">Current phase</div><div class="metric">01 / 08</div><strong>Master planning</strong><p>Choose our home base and the layout.</p></div><div class="card"><div class="small">Project milestones</div><div class="metric">'+p.done+' / '+p.all+'</div><div class="bar"><div style="width:'+p.pct+'%"></div></div><p>Only confirmed milestones count.</p></div><div class="card"><div class="small">Current game progress</div><div class="metric">Tier 4</div><strong>First two milestones unlocked</strong><p>Keep your existing production running during construction.</p></div></div><div class="section"><h2>Next best move</h2></div><div class="card"><h3>Find a home for Satisfactory HQ</h3><p>Pick a roomy, relatively flat area with space for separate districts, a wide central pedestrian avenue, and future expansions. Coal can be produced remotely rather than forcing every resource into the HQ location.</p><button class="btn alt" data-page="roadmap">Phase 1 checklist →</button></div><div class="section"><h2>The campus at a glance</h2></div><div class="card">'+map()+'</div>'}
function map(){return '<div class="campus"><div class="iron">Iron Works</div><div class="path">Glass skybridge</div><div class="steel">Steel Works</div><div class="path">Walkway</div><div class="hq">HQ · Workshop<br>Storage · Lookout</div><div class="path">Walkway</div><div class="assembly">Assembly Hall</div><div class="path">Manufacturing Avenue</div><div class="future">Future District</div></div><p class="small">Conceptual layout only. Actual building positions depend on the terrain and nearby resource nodes.</p>'}
function roadmap(){let p=progress();return header("Master roadmap.","Eight expandable phases. This is the shared plan, not another checklist you have to maintain.")+'<div class="card"><strong>Project progress: '+p.pct+'%</strong><p class="small">'+p.done+' of '+p.all+' milestones confirmed complete</p><div class="bar"><div style="width:'+p.pct+'%"></div></div></div><div class="section"><h2>Build phases</h2></div>'+project.phases.map((x,i)=>'<section class="phase"><button data-expand="'+i+'" aria-expanded="'+(expanded===i)+'"><span class="num">'+(i+1)+'</span><span style="flex:1"><strong>'+esc(x[0])+'</strong><br><span class="small">'+esc(x[1])+'</span></span><span class="status">'+(i===0?'CURRENT':'PLANNED')+' &nbsp; '+(expanded===i?'−':'+')+'</span></button>'+(expanded===i?'<div class="phase-body"><ol>'+x[2].map((t,j)=>'<li>'+esc(t)+(project.completed[i+'-'+j]?' ✓':'')+'</li>').join('')+'</ol><p class="small">Tell ChatGPT when you complete something and the site will be updated.</p></div>':'')+'</section>').join('')}
function buildings(){return header("Factory districts.","Specialized buildings, consistent architecture and room to expand.")+'<div class="grid">'+project.buildings.map((b,i)=>'<div class="card"><div class="colored" style="background:'+b.color+'"></div><span class="chip">PLANNED</span><h3>'+esc(b.name)+'</h3><p><strong>'+esc(b.role)+'</strong></p><p>'+esc(b.desc)+'</p><button class="btn alt" data-building="'+i+'">View design brief →</button></div>').join('')+'</div><div id="building-detail"></div>'}
function buildingDetail(i){let b=project.buildings[i],d=document.getElementById("building-detail");d.innerHTML='<div class="detail"><span class="tag">District design brief · Planned</span><h2>'+esc(b.name)+'</h2><p>'+esc(b.desc)+'</p><h3>Design intentions</h3><ul>'+b.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><p class="small">Blueprints and quantities will be finalized when we plan this building.</p></div>';d.scrollIntoView({behavior:"smooth",block:"nearest"})}
function blueprints(){return header("Blueprint library.","The modular building blocks to create in game. None are marked finished until you confirm.")+'<div class="grid">'+project.blueprints.map(b=>'<div class="card"><span class="chip">'+esc(b[1])+' · '+esc(b[2])+'</span><h3>'+esc(b[0])+'</h3><p>'+esc(b[3])+'</p></div>').join('')+'</div><div class="section"><h2>Blueprint philosophy</h2></div><div class="card"><p>Reuse small, standardized machine groups instead of fitting your whole iron supply chain into one blueprint. Preserve walkways and belt capacity. A consistent input/output orientation keeps expansion easy.</p></div>'}
function journal(){return header("Build journal.","A running record of our design decisions, inspiration and actual game progress.")+'<div class="card">'+project.journal.slice().reverse().map(x=>'<div class="listline"><span class="chip">'+esc(x[0])+'</span><span class="date">'+esc(x[3])+'</span><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></div>').join('')+'</div><div class="section"><h2>Questions we're saving for later</h2></div><div class="card"><ol class="steps">'+project.questions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>'}
function standards(){return header("Campus design language.","The rules that make this an efficient factory and a beautiful place to explore.")+'<div class="grid"><div class="card wide"><h3>Our color palette</h3><div class="swatches">'+["#edadd4","#a9d9f3","#a8dfc6","#c5b3f5","#f5f6fb","#353a4c"].map(c=>'<div class="swatch" title="'+c+'" style="background:'+c+'"></div>').join('')+'</div><p>Pastel pink HQ, blue iron, mint assembly, purple steel. Glass and white/charcoal structure tie the whole site together.</p></div><div class="card"><h3>Architecture</h3><p>Big glass panels, structural bays, catwalks, observation mezzanines, and simple, repeatable architectural pieces.</p></div><div class="card"><h3>Walkability</h3><p>One central pedestrian avenue, short access to storage, safe walkways, clear signage, future hypertubes.</p></div><div class="card"><h3>Logistics</h3><p>Conceal messy belts underneath production floors; intentionally showcase the cool conveyor runs behind glass.</p></div><div class="card"><h3>Expandable</h3><p>Reserve plots and duplicate modules. Improve production without rebuilding every beautiful structure.</p></div><div class="card"><h3>Single source of truth</h3><p>GitHub stores site updates. No browser-only checkboxes or disconnected databases.</p></div></div>'}
function render(){let valid=["overview","roadmap","buildings","blueprints","journal","standards"];if(!valid.includes(page))page="overview";app.innerHTML=({overview,roadmap,buildings,blueprints,journal,standards})[page]();document.querySelectorAll('.nav [data-page]').forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.querySelector(".more-toggle").classList.toggle("active",["blueprints","journal","standards"].includes(page))}
function closeMore(){const menu=document.getElementById("mobile-more"),toggle=document.querySelector(".more-toggle");menu.hidden=true;toggle.setAttribute("aria-expanded","false")}
document.addEventListener("click",e=>{let b=e.target.closest("[data-page],[data-expand],[data-building],[data-more]");if(!b){if(!e.target.closest("#mobile-more"))closeMore();return}if(b.dataset.more){const menu=document.getElementById("mobile-more"),next=!menu.hidden;menu.hidden=next;b.setAttribute("aria-expanded",String(!next));return}if(b.dataset.page){page=b.dataset.page;closeMore();location.hash=page;render();window.scrollTo(0,0)}else if(b.dataset.expand!==undefined){let i=+b.dataset.expand;expanded=expanded===i?-1:i;render()}else if(b.dataset.building!==undefined){buildingDetail(+b.dataset.building)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMore()});
addEventListener("hashchange",()=>{page=location.hash.slice(1)||"overview";render()});render();
</script></main></body></html>
