ess","Transfer iron smelting into expandable modules","Create plate and rod production lines with room to expand","Feed downstream assembly first; send surplus to HQ storage","Add visible conveyor windows and viewing walkway"]],["Assembly Hall","Move complex iron products into mint-green assembly bays.",["Build reinforced iron plate assembly supply lines","Add rotor production with local screw supply","Add modular frames without pulling ingredients through HQ","Connect outputs to downstream production and personal supply","Build railings and an overlook"]],["Steel Works","Give steel its own purple-accented district or satellite.",["Review how far coal and iron are from campus","Choose a local steel hall or remote steel production","Plan steel pipes and beams for expansion","Route steel outputs to HQ and manufacturing","Connect the building with an accessible path"]],["Campus connections","Make the whole campus walkable and worth looking at.",["Create a wide clear main concourse","Add glass skybridges with safe rails and stairs","Add colored building signage and interior lighting","Build a transit lobby and later hypertubes after unlocking them","Create at least one panorama view of all the active buildings"]],["Growth and finishing","Adapt to new unlocks without tearing everything down.",["Review actual throughput and bottlenecks","Upgrade miners, belts and blueprints when available","Build new production families in reserved plots","Add landscaping, glass detailing and lighting","Document the best designs and lessons learned"]]],"buildings":[{"name":"HQ · Workshop & Storage","color":"#edadd4","role":"Your main place to work","desc":"Pastel pink accents with white structure and glass. Workshop + grab-and-go supply wall downstairs; viewing mezzanine upstairs. Make this the return point after exploring.","steps":["Place Craft Bench, Equipment Workshop and MAM near HUB in one easy-to-find area","Use one labeled container per useful building material, with at least two work just for campus appearance","Build a foundry/constructor chain you can expand later","Deliver steel beam and pipe supplies to HQ and Assembly as needed","Use a named transit entry so the remote factory is easy to revisit"],"idea":"A remote satellite can match the HQ architecture and be linked later by hypertube."},{"name":"Manufacturing Avenue","color":"#b5d6e4","role":"Central walkways and overlooks","desc":"A grand walkway between glass-fronted industrial buildings. Think showroom, but everything inside is working.","steps":["Aim for two foundations of walkway width where terrain allows","Connect HQ to factory doors without crossing active belts","Include a glass skybridge linking upper walkways","Add stairs and safe railing access to production and logistics levels","Keep machine rows visible from a central scenic overlook"],"idea":"Make a panoramic viewing spot with the pink HQ behind you and colored factories ahead."},{"name":"Future Districts","color":"#dad5ea","role":"Expansion space","desc":"Dedicated space for later power, motors, electronics and larger production chains as they become relevant.","steps":["Do not fill every plot during Tier 4","Leave a straight path to extend the central avenue","Maintain consistent foundation alignment for future buildings","Expand transport links only after new unlocks warrant them"],"idea":"Keep a few empty foundation pads as an intentionally planned future district."}],"blueprints":[["Smelter Pod · 4","Production","Ready to design","Four smelters at 100% use 120 ore/min and output 120 iron ingots/min. Standardize ore entry, ingot exit and a maintenance edge."],["Plate Constructors · 2","Production","Ready to design","Two constructors use 60 ingots/min and produce 40 plates/min. Good compact starter unit."],["Rod Constructors · 4","Production","Ready to design","Four constructors use 60 ingots/min and produce 60 rods/min."],["Screw Supply Pod","Production","Planned","Local constructors near screw-consuming assemblers. Avoid shipping huge screw volumes between districts."],["Two-Assembler Bay","Production","Ready to design","Two assemblers with distinct inputs and a single output lane; preserve access and belt clearance."],["Glass Wall + Pillar","Architecture","Planned","Repeatable 4 or 8 meter facade sections with pastel framing and tall windows."],["Walkway + Rail","Architecture","Planned","Matching elevated catwalk segment with railing and a clean stair connection."],["HQ Storage Bay","Architecture","Planned","One labeled container front and a rear belt entry, with room to walk and grab supplies."]],"journal":[["Decision","Factory strategy","Choose a hybrid campus grouped by production family, not separate buildings for every screw or a single all-in-one smelter warehouse.","2026-11-16"],["Decision","Headquarters first","The main place to work includes HUB access, Craft Bench, Equipment Workshop, MAM, labeled storage and a glass observation mezzanine.","2026-11-16"],["Decision","Campus aesthetic","Pink HQ, blue Iron Works, mint Assembly Hall and purple Steel Works; white or charcoal frames with large glass windows.","2026-11-16"],["Decision","Walkability","Prioritize wide pedestrian paths, high walkways, glass skybridges and viewpoints into running production.","2026-11-16"],["Decision","Production vs storage","Assembly lines get direct ingredient feeds; only branch surplus into HQ storage for personal use.","2026-11-16"],["Decision","Screw strategy","Make screws close to whichever production line needs them, rather than building a distant central screw factory.","2026-11-16"],["Decision","Project platform","Satisfactory HQ is a read-only GitHub Pages site; ChatGPT commits requested changes, no separate database.","2026-11-16"],["Known progress","Tier 4 unlocked","FICSIT Blueprints and Logistics Mk.3 are unlocked. Advanced Steel Production, Expanded Power Infrastructure and Hypertubes remain upcoming.","2026-11-16"],["Open question","Location is not chosen","Campus build site, available node yields, preferred terrain and current AWESOME Shop purchases are not yet confirmed.","2026-11-16"]],"questions":["What part of the map is your existing base in? A screenshot would help choose the campus site.","How many iron nodes and how much ore/min are available near the proposed HQ?","Which foundation materials, glass and catwalks have you purchased from the AWESOME Shop?","Do you want Steel Works at HQ or near its distant coal supply?"]};
const app=document.getElementById("app");let page=(location.hash.slice(1)||"overview"),activeBuilding=-1,expanded=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function header(title,lead){return '<div class="eyebrow">SATISFACTORY HQ / FACTORY CAMPUS</div><h1 class="headline">'+esc(title)+'</h1><p class="lead">'+esc(lead)+'</p><span class="tag">'+esc(project.tier)+' · Phase '+project.phase+' · Planning</span>'}
function progress(){let all=project.phases.reduce((n,p)=>n+p[2].length,0),done=Object.values(project.completed).filter(Boolean).length;return {all,done,pct:Math.round(done/all*100)}}
function overview(){let p=progress();return header("Your next build starts here.","The useful stuff first. No huge planning document to wade through while you play.")+
'<section class="hero"><div class="eyebrow">YOUR NEXT SESSION · PHASE 1</div><h2>Find the perfect HQ location</h2><p>Keep your old production running. Scout somewhere roomy with a good view, level enough for a connected factory city, and space to grow.</p><button class="btn" data-page="roadmap">See what to do first →</button></section>'+
'<div class="grid"><div class="card"><div class="small">Current milestone</div><div class="metric">Tier 4</div><strong>Blueprints + Logistics Mk.3</strong><p>Both unlocked. Miner Mk.2 is next, not yet available.</p></div><div class="card"><div class="small">Campus stage</div><div class="metric">01 / 08</div><strong>Master planning</strong><p>No rebuild required until your new location is chosen.</p></div><div class="card"><div class="small">Verified tasks complete</div><div class="metric">'+p.done+' / '+p.all+'</div><div class="bar"><div style="width:'+p.pct+'%"></div></div><p>Roadmap progress only changes when you confirm it.</p></div></div>'+
'<div class="section"><h2>While you play</h2></div><div class="card"><ol class="steps">'+project.now.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol><p class="small">Tell ChatGPT what you built or unlocked; the hub gets updated.</p></div>'+
'<div class="section"><h2>Our planned campus</h2></div><div class="card">'+map()+'</div>'+
'<div class="section"><h2>What comes next in Tier 4</h2></div><div class="grid">'+project.milestones.map(m=>'<div class="card"><span class="chip">'+esc(m.status.toUpperCase())+'</span><h3>'+esc(m.name)+'</h3><p>'+esc(m.reward)+'</p></div>').join('')+'</div>'}

function roadmap(){let p=progress();return header("Master roadmap.","Eight expandable phases. This is the shared plan, not another checklist you have to maintain.")+'<div class="card"><strong>Project progress: '+p.pct+'%</strong><p class="small">'+p.done+' of '+p.all+' milestones confirmed complete</p><div class="bar"><div style="width:'+p.pct+'%"></div></div></div><div class="section"><h2>Build phases</h2></div>'+project.phases.map((x,i)=>'<section class="phase"><button data-expand="'+i+'" aria-expanded="'+(expanded===i)+'"><span class="num">'+(i+1)+'</span><span style="flex:1"><strong>'+esc(x[0])+'</strong><br><span class="small">'+esc(x[1])+'</span></span><span class="status">'+(i===0?'CURRENT':'PLANNED')+' &nbsp; '+(expanded===i?'−':'+')+'</span></button>'+(expanded===i?'<div class="phase-body"><ol>'+x[2].map((t,j)=>'<li>'+esc(t)+(project.completed[i+'-'+j]?' ✓':'')+'</li>').join('')+'</ol><p class="small">Tell ChatGPT when you complete something and the site will be updated.</p></div>':'')+'</section>').join('')}
function buildings(){return header("Factory districts.","Specialized buildings, consistent architecture and room to expand.")+'<div class="grid">'+project.buildings.map((b,i)=>'<div class="card"><div class="colored" style="background:'+b.color+'"></div><span class="chip">PLANNED</span><h3>'+esc(b.name)+'</h3><p><strong>'+esc(b.role)+'</strong></p><p>'+esc(b.desc)+'</p><button class="btn alt" data-building="'+i+'">View design brief →</button></div>').join('')+'</div><div id="building-detail"></div>'}
function buildingDetail(i){let b=project.buildings[i],d=document.getElementById("building-detail");d.innerHTML='<div class="detail"><span class="tag">Design brief · Planned</span><h2>'+esc(b.name)+'</h2><p>'+esc(b.desc)+'</p><h3>What will go here</h3><ul>'+b.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><div class="note"><strong>Design idea</strong><p>'+esc(b.idea)+'</p></div><p class="small">These are design intentions, not yet built in your game. Confirm progress in chat to update their status.</p></div>';d.scrollIntoView({behavior:"smooth",block:"nearest"})}

'<div class="grid">'+project.blueprints.map(b=>'<div class="card"><span class="chip">'+esc(b[1])+' · '+esc(b[2])+'</span><h3>'+esc(b[0])+'</h3><p>'+esc(b[3])+'</p></div>').join('')+'</div>'+
'<div class="section"><h2>Starter iron math</h2></div><div class="card"><h3>A clean 120 iron/min starter line</h3><p><strong>120 ore/min → 4 smelters → 120 ingots/min.</strong> Divide the ingots into 60/min for 2 plate constructors (40 plates/min) and 60/min for 4 rod constructors (60 rods/min).</p><p class="small">These numbers use standard recipes at 100% speed. It is a demonstration of matched rates, not a prescription for your final iron demand. Mk.3 belts can carry up to 270 items/min; check the busiest combined segments.</p><p><a class="toplink" target="_blank" rel="noopener noreferrer" href="https://satisfactory.wiki.gg/wiki/Blueprint_Designer">Blueprint Designer Mk.1 reference ↗</a></p></div>'+
'<div class="section"><h2>Our blueprint rules</h2></div><div class="card"><ol class="steps"><li><strong>Same orientation:</strong> input on one edge, output on another, maintenance corridor consistently placed.</li><li><strong>Blueprint by module:</strong> machine arrays, facade tiles and walkway tiles, not a huge factory that is painful to change.</li><li><strong>32×32×32 m limit:</strong> current Mk.1 Blueprint Designer, which equals a 4×4 foundation floor area.</li><li><strong>No forced ratios:</strong> choose production quantities after checking actual resource input and demand.</li><li><strong>Local screw production:</strong> place screw constructors close to consuming assemblers.</li></ol></div>'}
function journal(){return header("Build journal.","Confirmed decisions, current progress, and the open questions we can answer while playing.")+'<div class="card">'+project.journal.slice().reverse().map(x=>'<div class="listline"><span class="chip">'+esc(x[0])+'</span><span class="date">'+esc(x[3])+'</span><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></div>').join('')+'</div><div class="section"><h2>Questions we're saving for later</h2></div><div class="card"><ol class="steps">'+project.questions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>'}
function standards(){return header("Campus design language.","Our pretty pink, blue, green, and purple architectural system, without losing factory efficiency.")+'<div class="grid"><div class="card wide"><h3>Our color palette</h3><div class="swatches">'+["#edadd4","#a9d9f3","#a8dfc6","#c5b3f5","#f5f6fb","#353a4c"].map(c=>'<div class="swatch" title="'+c+'" style="background:'+c+'"></div>').join('')+'</div><p>Pastel pink HQ, blue iron, mint assembly, purple steel. Glass and white/charcoal structure tie the whole site together.</p></div><div class="card"><h3>Architecture</h3><p>Big glass panels, structural bays, catwalks, observation mezzanines, and simple, repeatable architectural pieces.</p></div><div class="card"><h3>Walkability</h3><p>One central pedestrian avenue, short access to storage, safe walkways, clear signage, future hypertubes.</p></div><div class="card"><h3>Logistics</h3><p>Conceal messy belts underneath production floors; intentionally showcase the cool conveyor runs behind glass.</p></div><div class="card"><h3>Expandable</h3><p>Reserve plots and duplicate modules. Improve production without rebuilding every beautiful structure.</p></div><div class="card"><h3>Single source of truth</h3><p>GitHub stores site updates. No browser-only checkboxes or disconnected databases.</p></div><div class="card"><h3>Before you demolish</h3><p>Keep the old machines producing materials for the new campus. Replace one working production chain at a time only after the new line works.</p></div><div class="card"><h3>Personal supply, not production bottleneck</h3><p>Send a branch of finished parts into your HQ warehouse; keep assembly feeds direct. Use storage as your shopping aisle, not the central intermediary for every machine.</p></div></div>'}
function render(){let valid=["overview","roadmap","buildings","blueprints","journal","standards"];if(!valid.includes(page))page="overview";app.innerHTML=({overview,roadmap,buildings,blueprints,journal,standards})[page]();document.querySelectorAll('.nav [data-page]').forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.querySelector(".more-toggle").classList.toggle("active",["blueprints","journal","standards"].includes(page))}
function closeMore(){const menu=document.getElementById("mobile-more"),toggle=document.querySelector(".more-toggle");menu.hidden=true;toggle.setAttribute("aria-expanded","false")}
document.addEventListener("click",e=>{let b=e.target.closest("[data-page],[data-expand],[data-building],[data-more]");if(!b){if(!e.target.closest("#mobile-more"))closeMore();return}if(b.dataset.more){const menu=document.getElementById("mobile-more"),next=!menu.hidden;menu.hidden=next;b.setAttribute("aria-expanded",String(!next));return}if(b.dataset.page){page=b.dataset.page;closeMore();location.hash=page;render();window.scrollTo(0,0)}else if(b.dataset.expand!==undefined){let i=+b.dataset.expand;expanded=expanded===i?-1:i;render()}else if(b.dataset.building!==undefined){buildingDetail(+b.dataset.building)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMore()});
addEventListener("hashchange",()=>{page=location.hash.slice(1)||"overview";render()});render();
</script></main></body></html>
