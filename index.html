<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7fc"><meta name="description" content="Your personal, visual Satisfactory factory guide."><title>Satisfactory HQ · My Factory</title>
<style>
:root{--bg:#f7f8fc;--paper:white;--ink:#252b3e;--muted:#626c82;--border:#e4e7f0;--pink:#f8d6ea;--blue:#d6ecfc;--mint:#dbf6e9;--lilac:#ebe1ff;--accent:#7056b8;--nav:#ffffff}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,a{font:inherit}button{cursor:pointer}a{color:#5b45a6}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(29px,4vw,42px);line-height:1.12;letter-spacing:-1px;margin-bottom:10px}h2{font-size:21px;letter-spacing:-.45px}h3{font-size:16px}p{color:var(--muted)}.shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:var(--nav);border-right:1px solid var(--border);padding:24px 14px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:850;padding:5px 8px 24px;display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:11px;background:conic-gradient(#eda9d0,#ae9cde,#99cde9,#a1e5cb,#eda9d0)}.subtitle{font-size:10px;letter-spacing:1.2px;color:#8c86a7}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:11px;text-align:left;padding:12px;font-weight:680;color:#677187}.nav button.active{background:#f1ecff;color:#604ba5}.sidebar-foot{margin-top:auto;font-size:12px;color:#8c91a5;padding:10px}.content{max-width:1120px;width:100%;padding:35px clamp(16px,4vw,55px) 100px;margin:0 auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#876fbc;font-weight:850;margin-bottom:9px}.lead{max-width:710px}.tag{display:inline-block;border-radius:40px;padding:5px 11px;background:#f0ecff;color:#6551a0;font-size:12px;font-weight:750}.success{background:#e1f6e8;color:#236b4a}.warn{background:#fff1dc;color:#8d5717}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0 23px}.hero,.card{background:white;border:1px solid var(--border);border-radius:19px;padding:22px}.hero{background:linear-gradient(115deg,#f9e4f0,#eef0ff 57%,#e6f9ef);padding:26px}.hero h2{font-size:clamp(22px,3vw,29px);margin:8px 0}.hero p{max-width:670px;margin-bottom:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section{margin:30px 0 13px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}.section h2{margin:0}.small{font-size:13px;color:var(--muted)}.card p:last-child{margin-bottom:0}.card strong{color:var(--ink)}.card h3{margin-bottom:7px}.num{font-size:29px;font-weight:850;letter-spacing:-1px}.recipe{border-left:6px solid #b9dff4}.recipe:nth-child(2){border-color:#d5bafb}.recipe:nth-child(3){border-color:#b6e3cc}.recipe .amount{font-weight:850;font-size:23px;line-height:1.2}.line{margin:14px 0;border-top:1px solid var(--border)}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;background:var(--accent);color:white!important;text-decoration:none;padding:11px 15px;font-size:13px;font-weight:800;min-height:45px}.button.secondary{background:#f0ecfc;color:#5d49a3!important}.buttonRow{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.steps{margin:0;padding-left:22px}.steps li{margin-bottom:12px;padding-left:4px}.steps li::marker{font-weight:900;color:var(--accent)}.state{display:inline-block;color:#397457;font-size:12px;font-weight:750}.note{background:#f8f7ff;border-radius:12px;padding:13px 15px;font-size:13px;color:#5e637d}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:13px;background:#e3e8ef;display:block}.caption{font-size:12px;color:#747d90;margin:7px 0 0}.mini{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:16px 0}.node{padding:12px 8px;border-radius:11px;text-align:center;font-weight:740;font-size:12px;background:#edf0f7;min-width:0;overflow-wrap:anywhere}.node.blue{background:var(--blue)}.node.pink{background:var(--pink)}.node.purple{background:var(--lilac)}.node.green{background:var(--mint)}.arrow{text-align:center;color:#9985c2;font-size:23px}.lanes{display:grid;gap:9px;margin:18px 0}.lane{display:grid;grid-template-columns:minmax(70px,1fr) 28px minmax(90px,1.2fr) 28px minmax(85px,1fr);align-items:center;gap:5px}.lane .node{padding:12px 5px}.diagram{background:#fbfcff;border:1px dashed #d1cee4;padding:14px;border-radius:14px}.diagram-title{font-weight:800;font-size:13px;margin-bottom:8px}.label{font-size:11px;letter-spacing:.8px;color:#837b9c;text-transform:uppercase;font-weight:800}.campus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:17px 0}.campus>div{padding:17px 6px;text-align:center;border-radius:10px;font-size:12px;font-weight:820}.path{background:#f6f7fb;border:1px dashed #bfc5d4;color:#8992a6}.disclosure{border:1px solid var(--border);background:white;border-radius:14px;margin:10px 0;overflow:hidden}.disclosure summary{list-style:none;cursor:pointer;padding:17px;font-weight:800}.disclosure summary::-webkit-details-marker{display:none}.disclosure summary:after{content:"+";float:right;color:var(--accent)}.disclosure[open] summary:after{content:"−"}.disclosure .inside{padding:0 17px 18px}.disclosure p{margin-bottom:10px}.checklist{margin:0;padding-left:18px}.checklist li{margin:9px 0}.fine{font-size:12px;color:#81899c}.hidden{display:none!important}.linklist{display:flex;flex-wrap:wrap;gap:13px;font-size:13px}.pill{background:#f1eff8;border-radius:8px;padding:7px 10px}.mapbox{background:linear-gradient(135deg,#e0f0db,#c5dbbc);border-radius:15px;padding:18px;position:relative;min-height:220px;display:grid;place-items:center;overflow:hidden}.mapbox:before{content:"";position:absolute;width:120%;height:45px;top:34%;left:-10%;background:#a5c3a0;transform:rotate(-24deg);border-radius:50%}.maplabel{position:relative;z-index:1;background:white;box-shadow:0 3px 15px #384d3b25;padding:13px;border-radius:12px;text-align:center;max-width:255px}.map-pin{font-size:22px}.mapbox .fine{color:#445f4c}.footer-note{padding:25px 0;font-size:12px;color:#8790a1}
@media(max-width:760px){.shell{display:block}.sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -5px 24px #28284912;border-right:0;border-top:1px solid var(--border)}.brand,.sidebar-foot{display:none}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.nav button{text-align:center;font-size:11px;line-height:1.2;min-height:49px;padding:7px 2px}.content{padding:24px 15px calc(115px + env(safe-area-inset-bottom))}.grid,.three{grid-template-columns:1fr}.hero,.card{padding:19px}.section{margin-top:24px}.lane{grid-template-columns:minmax(65px,1fr) 15px minmax(80px,1.2fr) 15px minmax(75px,1fr);gap:2px}.arrow{font-size:17px}.node{font-size:11px}.campus>div{font-size:10px;padding:14px 3px}}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="logo"></span><span>Satisfactory HQ<div class="subtitle">YOUR FACTORY COMPANION</div></span></div><nav class="nav" aria-label="Main navigation"><button data-page="today">⌂ Today</button><button data-page="factory">▦ My Factory</button><button data-page="hq">◇ Future HQ</button><button data-page="progress">✓ Progress</button></nav><div class="sidebar-foot">Updated November 17, 2026<br>Game state is confirmed in chat, not inferred from this page.</div></aside><main class="content" id="app"></main></div>
<script>
const reference={
 elevator:"https://satisfactory.wiki.gg/wiki/Space_Elevator",
 plating:"https://satisfactory.wiki.gg/wiki/Smart_Plating",
 framework:"https://satisfactory.wiki.gg/wiki/Versatile_Framework",
 wiring:"https://satisfactory.wiki.gg/wiki/Automated_Wiring",
 map:"https://satisfactory-calculator.com/en/interactive-map",
 guide:"https://satisfactorybase.com/guides/starter-base-grass-fields"
};
const image1="https://www.4netplayers.com/images/blog/satisfactory-tier-2-assembler-logistik/1.webp";
const image2="https://gamefoundry.games/images/blog/guides/satisfactory-beginner-guide-first-12-hours/inline-2.jpg";
const link=(url,title)=>'<a target="_blank" rel="noopener noreferrer" href="'+url+'">'+title+' ↗</a>';
function heading(k,title,lead){return '<div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p class="lead">'+lead+'</p>'}
function sketch(){return '<div class="diagram"><div class="diagram-title">Your current flow · conceptual, not a measured map</div><div class="lanes"><div class="lane"><div class="node blue">Iron machines</div><div class="arrow">→</div><div class="node pink">Starter depot</div><div class="arrow">→</div><div class="node green">Personal storage</div></div><div class="lane"><div class="node purple">Steel production</div><div class="arrow">→</div><div class="node pink">Conveyor delivery</div><div class="arrow">→</div><div class="node green">Steel containers</div></div><div class="lane"><div class="node blue">Copper production</div><div class="arrow">→</div><div class="node pink">Conveyor delivery</div><div class="arrow">→</div><div class="node green">Copper containers</div></div></div><div class="note">Add a small <strong>Phase 2 assembler area beside the containers</strong>. Leave existing lines running. Hand-feed from containers initially rather than rebuilding the entire belt network.</div></div>'}
function phaseCards(){return '<div class="grid three"><div class="card recipe"><div class="label">Space Elevator · 01</div><h3>Smart Plating</h3><div class="amount">1,000</div><p>Reinforced Iron Plate + Rotor → Assembler</p>'+link(reference.plating,"Recipe")+'</div><div class="card recipe"><div class="label">Space Elevator · 02</div><h3>Versatile Framework</h3><div class="amount">1,000</div><p>Modular Frame + Steel Beam → Assembler</p>'+link(reference.framework,"Recipe")+'</div><div class="card recipe"><div class="label">Space Elevator · 03</div><h3>Automated Wiring</h3><div class="amount">100</div><p>Stator + Cable → Assembler</p>'+link(reference.wiring,"Recipe")+'</div></div>'}
function today(){return heading("CURRENT SAVE · NOV 17","Finish Phase 2, then build your dream HQ.","You're done with HUB Tiers 1–4. The Space Elevator needs its second delivery to unlock Tiers 5–6.")+
'<div class="tags"><span class="tag success">HUB Tiers 1–4 done</span><span class="tag warn">Space Elevator Phase 2 active</span><span class="tag success">Coal power running</span></div>'+
'<section class="hero"><div class="eyebrow">YOUR NEXT TASK</div><h2>Add 3 temporary assembler stations</h2><p>Keep your iron, copper and steel supply lines. Build a small, easy-to-remove production area next to the sorted containers. You only need to feed the Space Elevator, not redesign your entire factory today.</p><div class="buttonRow"><button class="button" data-page="factory">See the layout →</button><button class="button secondary" data-page="progress">What unlocks next?</button></div></section>'+
'<div class="section"><h2>Do these in order</h2><span class="small">Next session</span></div><div class="card"><ol class="steps"><li><strong>Reserve a patch of foundations</strong> beside your starter containers, with room for three assemblers and two input paths each.</li><li><strong>Verify your ingredient supply</strong>: reinforced plates, rotors, modular frames, steel beams, stators and cable. Add small upstream machines only where something is missing.</li><li><strong>Set up the three Space Elevator recipes</strong>. Feed ingredients from containers while your existing machines refill them.</li><li><strong>Collect the outputs</strong> in clearly labeled temporary containers, then load the Space Elevator when all three totals are ready.</li></ol><p class="note">No need to move HQ, reroute coal power or demolish working production yet.</p></div>'+
'<div class="section"><h2>What you are making</h2></div>'+phaseCards()+
'<div class="section"><h2>Example: temporary assemblers</h2></div><div class="grid"><div class="card"><img class="photo" src="'+image1+'" loading="lazy" alt="Actual Satisfactory screenshot showing assembler machines and conveyor belts"><p class="caption">Real gameplay screenshot: assembler layout. Visual reference, not an exact blueprint for your save. Source: 4Netplayers.</p></div><div class="card"><h3>Simple layout</h3><div class="mini"><div class="node blue">2 ingredient containers</div><div class="arrow">→</div><div class="node green">Assembler → output container</div></div><p>Repeat for each recipe. You can refill the inputs by hand from your sorted storage. This avoids a sprawling permanent conveyor rebuild.</p><button class="button secondary" data-page="factory">Open full factory diagram</button></div></div>'}
function factory(){return heading("CURRENT BASE · GRASS FIELDS","Your starter factory.","A working temporary supply depot, not something to tear down.")+
'<div class="grid"><div class="card"><span class="tag success">CONFIRMED</span><h3>What you already have</h3><ul class="checklist"><li>Started near the original Grass Fields iron ore area</li><li>Separate containers for iron products</li><li>Copper products belt-fed to starter location with individual containers</li><li>Steel products belt-fed to starter location with individual containers</li><li>Coal electricity working</li></ul></div><div class="card"><span class="tag warn">NEXT ADDITION</span><h3>Small assembly corner</h3><ul class="checklist"><li>One assembler for Smart Plating</li><li>One for Versatile Framework</li><li>One for Automated Wiring</li><li>Small supporting constructors or assemblers only if needed for missing ingredients</li><li>Outputs collected separately for Elevator delivery</li></ul></div></div>'+
'<div class="section"><h2>Where everything flows</h2></div>'+sketch()+
'<div class="section"><h2>Find your location</h2></div><div class="grid"><div class="card"><div class="mapbox"><div class="maplabel"><div class="map-pin">📍</div><strong>Grass Fields · starter iron cluster</strong><div class="fine">Approximate reference near X −625, Y 2280</div></div></div><p class="caption">Area reference only, not your verified HUB coordinates. This is not a to-scale game map.</p><div class="buttonRow"><a class="button" target="_blank" rel="noopener noreferrer" href="'+reference.map+'">Open interactive game map ↗</a></div></div><div class="card"><h3>Get your exact coordinates</h3><ol class="steps"><li>Stand at your HUB or central storage.</li><li>Open the in-game map and hover your base.</li><li>Read the X and Y coordinates from the map.</li><li>Share them here later so I can pin your actual base and future HQ accurately.</li></ol>'+link(reference.guide,"Reference starter iron area")+'</div></div>'+
'<div class="section"><h2>Layout inspiration</h2></div><div class="grid"><div class="card"><img class="photo" loading="lazy" src="'+image2+'" alt="Real Satisfactory screenshot of starter production machines on raised foundations"><p class="caption">Real gameplay screenshot: compact early factory on foundations. Source: Game Foundry.</p></div><div class="card"><h3>Keep it simple, not perfect</h3><p>Put temporary assembly on adjacent foundations, keep walking access to every container, and preserve a clear connection to the Space Elevator. Permanent logistics belongs in the future campus.</p><p><strong>Design choice:</strong> storage is for you to grab supplies; eventually major production lines should feed other machines directly instead of passing through personal storage.</p></div></div>'}
function hq(){return heading("LATER · DESIGN VISION","Your dream HQ stays the goal.","We're building toward a pastel glass factory campus. You're not moving today.")+
'<div class="tags"><span class="tag" style="background:var(--pink)">Pink · HQ</span><span class="tag" style="background:var(--blue)">Blue · Iron</span><span class="tag" style="background:var(--mint)">Green · Assembly</span><span class="tag" style="background:var(--lilac)">Purple · Steel</span></div>'+
'<div class="card"><h3>Conceptual campus diagram</h3><div class="campus"><div style="background:var(--blue)">Iron Works</div><div class="path">Glass bridge</div><div style="background:var(--lilac)">Steel Works</div><div class="path">Walkway</div><div style="background:var(--pink)">Glass HQ<br>Storage + workshop</div><div class="path">Walkway</div><div style="background:var(--mint)">Assembly Hall</div><div class="path">Main avenue</div><div style="background:#eff0f5">Future expansion</div></div><p class="fine">A visual concept, not a real-world arrangement or a confirmed destination on the game map.</p></div>'+
'<div class="section"><h2>The plan, without 8 pages of steps</h2></div>'+
'<div class="grid"><div class="card"><div class="num">01</div><h3>Finish Phase 2</h3><p>Let your existing base supply the next game unlocks.</p><span class="tag warn">NOW</span></div><div class="card"><div class="num">02</div><h3>Scout the new site</h3><p>Compare flat terrain, views and expansion space. Confirm coordinates before moving.</p><span class="tag">AFTER PHASE 2</span></div><div class="card"><div class="num">03</div><h3>Build HQ and blueprint modules</h3><p>Glass workshop, labeled personal storage and repeating factory modules.</p><span class="tag">LATER</span></div><div class="card"><div class="num">04</div><h3>Move one production family at a time</h3><p>Iron, assembly and steel districts, connected with walkways. Keep old lines until replacements work.</p><span class="tag">LATER</span></div></div>'+
'<div class="section"><h2>Details only if you need them</h2></div>'+
'<details class="disclosure"><summary>HQ interior</summary><div class="inside"><p>HUB, MAM, crafting benches, visible storage wall, clear walking aisles and a mezzanine overlook. Personal supply storage is separate from the production network.</p></div></details>'+
'<details class="disclosure"><summary>Factory buildings</summary><div class="inside"><p>Blue iron smelting and constructors, mint assembly bays and purple steel production. Expand each building in repeatable machine bays.</p></div></details>'+
'<details class="disclosure"><summary>Blueprints and transit</summary><div class="inside"><p>Reusable 4×4 foundation footprint modules for the Mk.1 Blueprint Designer; keep input/output sides consistent. Add skybridges and hypertubes as your unlocks allow.</p></div></details>'+
'<div class="note">The previous website's long building plans are intentionally condensed here. We will build detailed plans when you are actually ready for that step.</div>'}
function progress(){return heading("MILESTONES · YOUR SAVE","Where you are in the game.","Only confirmed accomplishments are marked complete. The next goal is clear.")+
'<div class="card"><h3>Game progression</h3><div class="line"></div><p><span class="tag success">DONE</span> HUB Tiers 1, 2, 3 and 4</p><p><span class="tag success">DONE</span> Space Elevator Phase 1</p><p><span class="tag warn">IN PROGRESS</span> Space Elevator Phase 2 · Construction Dock</p><p><span class="tag">LOCKED</span> HUB Tiers 5 and 6 · unlock after Phase 2 delivery</p><p><span class="tag">FUTURE</span> Phase 3 and beyond</p></div>'+
'<div class="section"><h2>Required for the next unlock</h2></div>'+phaseCards()+
'<div class="section"><h2>What we know about your factory</h2></div><div class="card"><ul class="checklist"><li>Grass Fields iron-node starting area</li><li>Separate personal containers for each material</li><li>Remote copper and steel delivered by conveyor</li><li>Coal generators established</li><li>Starter site stays temporary while you work on Phase 2</li><li>Mixed automation: component production plus hand-fed final assemblers</li></ul><p class="small">Exact current output counts, precise coordinates and the ultimate HQ location are not yet confirmed.</p></div>'+
'<div class="section"><h2>Trusted recipe and map references</h2></div><div class="card"><div class="linklist">'+link(reference.elevator,"Space Elevator requirements")+link(reference.framework,"Versatile Framework")+link(reference.wiring,"Automated Wiring")+link(reference.map,"Interactive map")+'</div></div>'+
'<p class="footer-note">Your site is maintained in GitHub through ChatGPT. It deliberately does not pretend to save task completion from browser-only taps.</p>'}
const pages={today,factory,hq,progress};let page=(location.hash||"#today").slice(1);function render(){if(!pages[page])page="today";document.getElementById("app").innerHTML=pages[page]();document.querySelectorAll(".nav button").forEach(b=>{b.classList.toggle("active",b.dataset.page===page);if(b.dataset.page===page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
document.addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(!b)return;page=b.dataset.page;location.hash=page;render();window.scrollTo(0,0)});addEventListener("hashchange",()=>{page=location.hash.slice(1);render()});render();
</script></body></html>
