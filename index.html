<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satisfactory HQ · Factory Command Center</title><meta name="description" content="Your personal Satisfactory factory command center">
<style>
:root{--bg:#f7f8fc;--ink:#282d40;--muted:#67718a;--line:#e3e6f0;--accent:#6953ae;--pink:#f7dcea;--blue:#d9edfb;--mint:#dcf3e5;--purple:#ebe1fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.55 system-ui,-apple-system,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}a{color:#634fa4}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin:0 0 13px}h1{font-size:clamp(29px,3.5vw,44px);letter-spacing:-1.2px;line-height:1.13}h2{font-size:22px}h3{font-size:17px}p{color:var(--muted)}.shell{display:grid;grid-template-columns:226px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:23px 13px}.brand{font-size:19px;font-weight:850;display:flex;gap:11px;align-items:center;padding:4px 9px 26px}.brand small{display:block;color:#9b8fb5;letter-spacing:1.5px;font-size:10px}.mark{height:35px;width:35px;flex:none;border-radius:11px;background:conic-gradient(#ecabd1,#b4a3e7,#9bcde8,#a4dfc7,#ecabd1)}.nav{display:grid;gap:4px}.nav button{background:transparent;border:0;text-align:left;font-size:13px;color:#647086;padding:12px;border-radius:10px;font-weight:730}.nav button.active,.nav button:hover{background:#f0ebfc;color:#5f48a1}.foot{margin-top:auto;font-size:12px;color:#8a91a3;padding:10px}.main{max-width:1260px;width:100%;margin:0 auto;padding:38px clamp(16px,3.5vw,54px) 90px}.eyebrow{font-weight:850;font-size:11px;letter-spacing:1.5px;color:#8573b2;text-transform:uppercase;margin-bottom:8px}.lead{max-width:730px;margin-bottom:24px}.card,.hero{background:white;border:1px solid var(--line);border-radius:19px;padding:22px;min-width:0}.hero{background:linear-gradient(110deg,#fae5f0,#eeecff 55%,#e6f7ed);padding:27px}.hero h2{font-size:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.section{margin:30px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{margin:0}.tag{display:inline-block;font-size:11px;padding:5px 10px;border-radius:25px;background:#efebfa;color:#6550a6;font-weight:800;margin:2px}.good{background:#e2f5e9;color:#28764f}.warn{background:#fff1de;color:#825818}.btn{display:inline-flex;text-decoration:none;background:var(--accent);border:0;color:white!important;font-size:13px;font-weight:800;border-radius:10px;padding:11px 15px;min-height:44px;align-items:center}.btn.alt{background:#eeeafb;color:#5d479f!important}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e5e7ee;border-radius:13px}.caption{font-size:12px;color:#768095;margin-top:7px}.steps{padding-left:22px;margin:0}.steps li{margin:10px 0}.steps li::marker{color:#7a60b7;font-weight:850}.note{background:#f5f1ff;padding:12px;border-radius:10px;font-size:13px;color:#5c5776}.tiplink{font-size:13px;font-weight:760}.search{display:block;width:100%;border:1px solid #d2d7e5;border-radius:10px;padding:12px;margin:12px 0}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.filters button{border:1px solid var(--line);background:#fff;color:#596279;border-radius:30px;padding:7px 12px;font-size:12px}.filters button.selected{background:#ece6fc;color:#59409a;border-color:#b9a7e1}.item{border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:15px;justify-content:space-between;align-items:center}.item:last-child{border:0}.tiny{color:#7b8598;font-size:12px}.item strong{display:block}.disclosure{border:1px solid var(--line);border-radius:12px;background:white;margin:9px 0;overflow:hidden}.disclosure summary{cursor:pointer;padding:15px 17px;font-weight:800}.disclosure .detail{padding:0 17px 16px}.campus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.campus div{padding:19px 5px;border-radius:10px;text-align:center;font-weight:800;font-size:12px}.path{background:#f3f4f9;border:1px dashed #bac1d2;color:#8791a5}.mapimg{display:block;width:100%;max-height:470px;object-fit:contain;border-radius:13px;background:#e3eadf}.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{font-size:12px;border-radius:7px;background:#f1eef8;padding:8px}.sublinks{display:flex;flex-wrap:wrap;gap:12px;margin-top:13px}.sublinks a{font-size:13px}.archive{font-size:13px;color:#6b738a}@media(max-width:1050px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{display:block}.side{position:fixed;inset:auto 0 0;height:auto;z-index:20;border-top:1px solid var(--line);border-right:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 24px #30304b15}.brand,.foot{display:none}.nav{display:flex;overflow-x:auto}.nav button{flex:0 0 auto;min-width:76px;min-height:49px;font-size:11px;text-align:center;padding:7px 5px}.main{padding:23px 15px calc(117px + env(safe-area-inset-bottom))}.grid,.grid3{grid-template-columns:1fr}.hero,.card{padding:19px}.hero h2{font-size:24px}.campus div{font-size:10px;padding:16px 3px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="mark"></div><div>Satisfactory HQ<small>FACTORY COMMAND CENTER</small></div></div><nav class="nav" aria-label="Main pages"><button data-page="today">⌂ Overview</button><button data-page="depot">▦ Supply Depot</button><button data-page="blueprints">◇ Blueprints</button><button data-page="map">◎ World Map</button><button data-page="hq">▤ HQ Plan</button><button data-page="tips">✦ Tips & Guides</button></nav><div class="foot">Living factory plan · Updated through ChatGPT</div></aside><main class="main" id="app"><h1>Satisfactory HQ</h1><p>Loading your factory guide…</p></main></div>
<script>
const urls={wiki:"https://satisfactory.wiki.gg/wiki/",map:"https://satisfactory-calculator.com/en/interactive-map",library:"https://satisfactory-calculator.com/en/blueprints",smart:"https://satisfactory-calculator.com/en/blueprints/index/details/id/9169/name/Bare+Bones+Smart+Plating+Factory+(4ppm)",tower:"https://satisfactory-calculator.com/en/blueprints/index/details/id/2905/name/Assembly+Tower+%2B+Storage.MK1"};
const assemblerImg="https://www.4netplayers.com/images/blog/satisfactory-tier-2-assembler-logistik/1.webp";
const inventory=[
["Concrete","Basics","Now","Automate","Foundations and construction"],["Iron Plate","Iron","Now","Automate","Everyday building supplies"],["Iron Rod","Iron","Now","Automate","Buildings, screws, rotors"],["Screw","Iron","Now","Small bin","Useful for grabbing; manufacture extra locally"],["Reinforced Iron Plate","Iron","Now","Automate","Assemblers and Smart Plating"],["Rotor","Iron","Now","Automate","Smart Plating and motors"],["Modular Frame","Iron","Now","Automate","Versatile Framework and buildings"],["Wire","Copper","Now","Automate","Electrical building and stators"],["Cable","Copper","Now","Automate","Power and Automated Wiring"],["Copper Sheet","Copper","Now","Automate","Pipelines and future electronics"],["Steel Beam","Steel","Now","Automate","Mk.3 belts and Versatile Framework"],["Steel Pipe","Steel","Now","Automate","Stators and mechanical builds"],["Stator","Advanced","Now","Small bin","Automated Wiring and motors"],["Motor","Advanced","Soon","Later","Future machine builds"],["Encased Industrial Beam","Advanced","Soon","Later","Advanced construction upgrades"],["Smart Plating","Elevator","Now","Output bin","Phase 2 needs 1,000"],["Versatile Framework","Elevator","Now","Output bin","Phase 2 needs 1,000"],["Automated Wiring","Elevator","Now","Output bin","Phase 2 needs 100"],["Fabric","Optional","Optional","Small stash","Gas filters and exploration gear"],["Solid Biofuel","Optional","Optional","Small stash","Chainsaw and backup supply"],["Black Powder","Optional","Optional","Small stash","Future exploration equipment"]];
const tips=[
["storage","Keep personal storage separate from production","At your starter base, a container for each grab-and-go part is great. For future factories, feed machines from production lines rather than routing everything through storage.","depot"],
["screws","Produce extra screws near consuming machines","Screws can overwhelm conveyor capacity. Keep a small personal bin, but make most screws close to rotor and reinforced plate assemblers.","depot"],
["manifold","Manifolds beat complicated balancing for most builds","A simple splitter chain eventually fills and stabilizes. Skip elaborate balancers unless you have a specific bottleneck.","depot"],
["blueprint","Check downloaded blueprints before installing","Verify the game version, included .sbp file and the build volume. Your Mk.1 designer fits 32 × 32 × 32 meters; huge builds may be map megaprints.","blueprints"],
["coal","Leave power headroom when adding machines","Check production capacity against peak consumption; coal miners and water extractors need stable power to keep generators running.","today"],
["explore","Research quality-of-life unlocks when useful","MAM research, hard drives, movement gear and alternate recipes can simplify later construction, but do not need to block Phase 2.","today"],
["coordinates","Confirm coordinates before mapping your exact factory","A starting area is not an exact HUB location. Use your map screenshot or save coordinates before plotting transport routes.","map"],
["future","Do not rebuild the same working line twice","Keep the Grass Fields base supplying materials. Move a production family only once its planned replacement is working.","hq"]];
const link=(url,name)=>'<a target="_blank" rel="noopener noreferrer" href="'+url+'">'+name+' ↗</a>';
const btn=(page,name)=>'<button class="btn" data-page="'+page+'">'+name+'</button>';
const tip=id=>'<a class="tiplink" href="#tips/'+id+'">Related tip: '+tips.find(t=>t[0]===id)[1]+' →</a>';
const head=(mini,title,desc)=>'<div class="eyebrow">'+mini+'</div><h1>'+title+'</h1><p class="lead">'+desc+'</p>';
const section=name=>'<div class="section"><h2>'+name+'</h2></div>';
const img=(src,alt)=>'<img class="photo" src="'+src+'" alt="'+alt+'" loading="lazy" onerror="this.alt=&quot;Image unavailable: use the linked reference instead&quot;">';
function overview(){return head("PHASE 2 · ACTIVE","What should I build next?","Your starter depot is working. Keep it operational and use it to unlock the next milestones.")+
'<section class="hero"><div class="eyebrow">NEXT BUILD</div><h2>Three temporary assembler stations</h2><p>Make Smart Plating, Versatile Framework and Automated Wiring alongside your sorted containers. No massive rerouting or HQ move needed yet.</p><div class="actions">'+btn("depot","Check my supply list")+btn("blueprints","Browse blueprints")+'</div></section>'+
section("Three steps forward")+'<div class="grid3"><div class="card"><span class="tag warn">NOW</span><h3>1. Set up assemblers</h3><p>Use two input sources and one output bin per recipe. Hand-feeding from the depot is fine for this temporary setup.</p>'+tip("storage")+'</div><div class="card"><span class="tag">NEXT</span><h3>2. Check ingredient stock</h3><p>Reinforced plates, rotors, modular frames, steel beams, stators and cable. Add a small supporting line where needed.</p>'+tip("screws")+'</div><div class="card"><span class="tag">THEN</span><h3>3. Deliver to Space Elevator</h3><p><strong>1,000</strong> Smart Plating<br><strong>1,000</strong> Versatile Framework<br><strong>100</strong> Automated Wiring</p>'+link(urls.wiki+"Space_Elevator","Official requirements")+'</div></div>'+
section("Example: assembler setup")+'<div class="grid"><div class="card">'+img(assemblerImg,"Actual Satisfactory gameplay assembler conveyor setup")+'<p class="caption">Real gameplay example. Use it for machine spacing and belt inspiration, not as a copy of your save.</p></div><div class="card"><h3>Keep the assembly corner simple</h3><ol class="steps"><li>Put three assemblers near your storage aisle.</li><li>Feed each with its two recipe ingredients.</li><li>Send outputs into separate labeled bins.</li><li>Load the Space Elevator when all three totals are ready.</li></ol><p class="note">No long-term HQ demolition or conveyor redesign required.</p>'+tip("coal")+'</div></div>'+
section("One next quality-of-life win")+'<div class="card"><h3>Make the storage aisle your grab-and-go workshop</h3><p>You already have iron, copper and steel feeding your original base. Fill gaps in useful building materials rather than building another massive sorter.</p>'+btn("depot","Open container checklist")+'</div>'}
function depot(){return head("CONTAINER PLANNER","Your starter supply depot","The suggested inventory below is not a claim that every individual part has a container already. Existing iron/copper/steel streams are confirmed; exact item-by-item stock is not.")+
'<div class="grid"><div class="card"><span class="tag good">CONFIRMED</span><h3>Your current setup</h3><p>Original Grass Fields iron area. Separate containers for iron products, copper and steel products delivered by conveyors, and working coal power.</p></div><div class="card"><span class="tag warn">NEXT</span><h3>Fill practical gaps</h3><p>Prioritize convenient building parts first. Space Elevator parts get temporary output bins; fabric and niche exploration items only need a small stash.</p>'+tip("storage")+'</div></div>'+
section("What deserves a container?")+'<div class="card"><input class="search" id="searchItems" type="search" placeholder="Search by item or use…" aria-label="Search suggested inventory"><div id="filters" class="filters"></div><div id="itemList"></div><p class="tiny">Now = useful immediately · Soon = later unlocks/builds · Optional = stash only if convenient.</p></div>'+
section("Real-world example")+'<div class="grid"><div class="card">'+img(assemblerImg,"Satisfactory machine arrangement reference")+'<p class="caption">Use actual machines and storage access as the visual reference.</p></div><div class="card"><h3>What not to build</h3><p>A complicated warehouse bus that forces all production through your personal bins. Your current separate delivery containers are already an excellent temporary arrangement.</p>'+tip("screws")+'<p>'+tip("manifold")+'</p></div></div>'}
function blueprints(){return head("ACTUAL DOWNLOAD SOURCES","Blueprints worth downloading","Start with reusable practical modules; check compatibility before committing resources.")+
'<div class="grid3"><div class="card"><span class="tag good">RESEARCHED OPTION</span><h3>Bare Bones Smart Plating Factory</h3><p>Community Smart Plating blueprint (4 per minute). Useful as a Phase 2 reference, though a three-assembler temporary setup may be more efficient for you right now.</p>'+link(urls.smart,"See previews and download")+'</div><div class="card"><span class="tag warn">OLDER BLUEPRINT</span><h3>Assembly Tower + Storage Mk.1</h3><p>Assemblers plus storage in one compact design. Older upload; confirm game-version compatibility before installing.</p>'+link(urls.tower,"See previews and download")+'</div><div class="card"><span class="tag">CURATED SEARCH</span><h3>Storage and assembly modules</h3><p>Explore compact Mk.1 designs with belt access and room to expand; not every listing fits the Mk.1 Designer.</p>'+link(urls.library,"Browse downloadable blueprints")+'</div></div>'+
section("How to choose a good download")+'<div class="card"><ol class="steps"><li>Check for a genuine .sbp blueprint download, not a whole-map megaprint.</li><li>Confirm it fits 32 × 32 × 32 m if you intend to load it into Blueprint Designer Mk.1.</li><li>Review version, screenshot, build materials, unlocks, and input/output directions.</li><li>Test a copy in an empty patch before connecting it to existing production.</li></ol>'+tip("blueprint")+'</div>'+
section("Future download wishlist")+'<div class="grid"><div class="card"><h3>Useful immediately</h3><p>Compact assembler modules · labeled storage · simple conveyor junctions · machine service aisles.</p></div><div class="card"><h3>Save for dream HQ</h3><p>Glass facades · skybridges · modular iron/steel production pods · observation decks.</p></div></div>'}
function map(){return head("YOUR WORLD · GRASS FIELDS","A custom map, without made-up pins","The site uses real Grass Fields map imagery as a reference. Exact facility markers will need your coordinates or a save-file screenshot.")+
'<div class="card"><img class="mapimg" src="https://satisfactory.wiki.gg/wiki/Special:Redirect/file/Grass_Fields_Map.png" alt="Reference terrain map of Grass Fields area"><p class="caption">Grass Fields reference map (Satisfactory wiki). This image is not yet an overlay of your personal save.</p><div class="chiprow"><span class="chip">● Iron starter depot: region confirmed</span><span class="chip">○ Copper factory: coordinates needed</span><span class="chip">○ Steel factory: coordinates needed</span><span class="chip">◇ Future HQ: under evaluation</span></div><div class="actions"><a class="btn" target="_blank" rel="noopener noreferrer" href="'+urls.map+'">Open full interactive world map ↗</a></div></div>'+
section("Make the map accurate")+'<div class="grid"><div class="card"><h3>Capture your real location</h3><ol class="steps"><li>Stand at your HUB/storage in the game.</li><li>Open the map and record your X and Y.</li><li>Do the same for copper and steel, or provide a full screenshot/save.</li><li>Then we can add accurate labeled pins and future HQ comparisons.</li></ol>'+tip("coordinates")+'</div><div class="card"><h3>Location decision: not urgent</h3><p>Keep working from Grass Fields for Phase 2. Compare scenery, logistics distance and room to grow before choosing the permanent campus site.</p>'+tip("future")+'</div></div>'}
function hq(){return head("MASTER PLAN","The future glass HQ campus","A project-plan view of the long-term vision, with prior decisions kept for reference instead of overwhelming the homepage.")+
'<section class="hero"><div class="eyebrow">VISION</div><h2>One beautiful, expandable factory campus</h2><p>Pink glass HQ and supply wall. Blue iron, mint assembly and purple steel buildings. Upper viewing spaces, walkable streets, repeatable blueprints and future travel links.</p></section>'+
section("Conceptual districts")+'<div class="card"><div class="campus"><div style="background:var(--blue)">Iron Works</div><div class="path">Glass bridge</div><div style="background:var(--purple)">Steel Works</div><div class="path">Walkway</div><div style="background:var(--pink)">HQ & personal storage</div><div class="path">Walkway</div><div style="background:var(--mint)">Assembly Hall</div><div class="path">Main avenue</div><div style="background:#f0f1f6">Future zone</div></div><p class="tiny">Architecture concept only, not a geographic or construction-accurate placement.</p></div>'+
section("Project sequence")+'<div class="grid"><div class="card"><span class="tag warn">NOW</span><h3>Phase 2 and supply depot</h3><p>Maintain the old factory and make the three elevator components.</p></div><div class="card"><span class="tag">NEXT</span><h3>Scout with accurate coordinates</h3><p>Check accessibility, views, resources and construction space.</p></div><div class="card"><span class="tag">LATER</span><h3>Build HQ shell and modules</h3><p>Workspace, storage, observation platform and repeatable blueprint pieces.</p></div><div class="card"><span class="tag">LATER</span><h3>Migrate production family by family</h3><p>Keep old production running until each new building is actually working.</p></div></div>'+
section("Archive & prior decisions")+'<details class="disclosure"><summary>Confirmed factory history</summary><div class="detail"><p>Space Elevator Phase 1 completed; HUB Tiers 1–4 completed; coal power running; separate iron, copper and steel product containers feeding your starter area.</p></div></details><details class="disclosure"><summary>Earlier eight-stage campus roadmap</summary><div class="detail"><ol class="steps"><li>Plan site</li><li>Build HQ</li><li>Prototype blueprints</li><li>Iron Works</li><li>Assembly Hall</li><li>Steel Works</li><li>Campus connections</li><li>Expand and decorate</li></ol></div></details><details class="disclosure"><summary>Architectural non-negotiables</summary><div class="detail"><p>Pastel pink, blue, mint and purple. Light structural framing and lots of glass. Walkways, labeled personal storage, observation mezzanines and expansion space.</p></div></details><p style="margin-top:14px">'+tip("future")+'</p>'}
function tipsPage(){return head("REFERENCE · CONTEXTUAL HELP","Tips & Guides","Tap any guide or follow links from the page where the tip matters. Nothing here is required reading.")+'<div class="card">'+tips.map(t=>'<details class="disclosure" id="tip-'+t[0]+'"><summary>'+t[1]+'</summary><div class="detail"><p>'+t[2]+'</p><a href="#'+t[3]+'">Back to related page →</a></div></details>').join("")+'</div>'}
const pages={today:overview,depot,blueprints,map,hq,tips:tipsPage};
let itemFilter="All",searchText="";
function drawFilters(){const items=["All","Now","Soon","Optional","Iron","Copper","Steel","Advanced"];document.getElementById("filters").innerHTML=items.map(x=>'<button data-filter="'+x+'" class="'+(x===itemFilter?"selected":"")+'">'+x+'</button>').join("")}
function drawItems(){const items=inventory.filter(x=>(itemFilter==="All"||x[1]===itemFilter||x[2]===itemFilter)&&x.join(" ").toLowerCase().includes(searchText.toLowerCase()));document.getElementById("itemList").innerHTML=items.map(x=>'<div class="item"><div><strong>'+x[0]+'</strong><div class="tiny">'+x[4]+'</div></div><div style="text-align:right"><span class="tag '+(x[2]==="Now"?"good":"")+'">'+x[2]+'</span><div class="tiny">'+x[3]+'</div></div></div>').join("")||'<p>No matching items.</p>'}
function render(){const hash=decodeURIComponent(location.hash.slice(1)).split("/"),p=pages[hash[0]]?hash[0]:"today";document.getElementById("app").innerHTML=pages[p]();document.querySelectorAll(".nav button").forEach(b=>{b.classList.toggle("active",b.dataset.page===p);b.setAttribute("aria-current",String(b.dataset.page===p))});if(p==="depot"){drawFilters();drawItems();document.getElementById("searchItems").value=searchText}if(p==="tips"&&hash[1]){const d=document.getElementById("tip-"+hash[1]);if(d){d.open=true;d.scrollIntoView({block:"start"})}}}
document.addEventListener("click",e=>{const filter=e.target.closest("[data-filter]");if(filter){itemFilter=filter.dataset.filter;drawFilters();drawItems();return}const b=e.target.closest("[data-page]");if(b){location.hash=b.dataset.page;render();window.scrollTo(0,0)}});
document.addEventListener("input",e=>{if(e.target.id==="searchItems"){searchText=e.target.value;drawItems()}});
addEventListener("hashchange",render);render();
</script></body></html>
